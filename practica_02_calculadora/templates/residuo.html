<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residuo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <header class="encabezado">
        <!-- Punto 6: Nombre del proyecto cambiado -->
        <h1>Supercalculadora con Flask</h1>
        <nav class="menu">
            <a href="/suma">Suma</a>
            <a href="/resta">Resta</a>
            <a href="/multiplicacion">Multiplicación</a>
            <a href="/division">División</a>
            <a href="/residuo">Residuo</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="tarjeta-operacion">
            <h2>Residuo (Módulo)</h2>
            <!-- Punto 2: Texto explicativo de la operación -->
            <p class="descripcion-operacion">Esta operación calcula el resto o residuo que queda al dividir un número entero entre otro.</p>
            
            <form method="POST">
                <label for="numero1">Primer número</label>
                <input id="numero1" name="numero1" type="number" step="any" required>

                <label for="numero2">Segundo número</label>
                <input id="numero2" name="numero2" type="number" step="any" required>

                <!-- Punto 3: Botón modificado con el símbolo de la operación -->
                <button class="boton" type="submit">Calcular (%)</button>
            </form>

            <!-- Bloque para mostrar el mensaje de error si el segundo número es cero -->
            {% if error %}
                <p class="error">
                    {{ error }}
                </p>
            {% endif %}

            <!-- Bloque para mostrar el resultado redondeado a 2 decimales -->
            {% if resultado is not none %}
                <p class="resultado">
                    Resultado: {{ resultado }}
                </p>
            {% endif %}
        </section>
    </main>

</body>
</html>
